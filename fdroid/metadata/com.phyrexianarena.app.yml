AntiFeatures:
  NonFreeNet:
    en-US: Depends on hosted Supabase, Scryfall, Archidekt, Moxfield, EDHREC, Resend,
      Turnstile, and other fixed network services that are not user-configurable in
      this release.
Categories:
  - Card Game
License: MIT
SourceCode: https://github.com/marco201091-glitch/PhyrexianArena

RepoType: git
Repo: https://github.com/marco201091-glitch/PhyrexianArena.git

Builds:
  - versionName: 8.0.0
    versionCode: 80000
    commit: REPLACE_WITH_FDROID_RELEASE_COMMIT_SHA
    timeout: 7200
    subdir: expo
    sudo:
      - apt-get update
      - apt-get install -y ca-certificates curl
      - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      - apt-get install -y nodejs
    init:
      - cd .. && npm ci
      - cd expo && npm ci
      - node scripts/patch-fdroid-java-toolchains.mjs
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - export APP_VARIANT=fdroid
      - export EXPO_PUBLIC_FDROID_BUILD=true
      - export EXPO_PUBLIC_SENTRY_ENABLED=false
      - export EXPO_PUBLIC_DISABLE_PUSH_NOTIFICATIONS=true
      - npx --no-install expo prebuild --platform android --clean --no-install
      - cd ..
      - npm run verify:fdroid
      - cd expo
      - npm run typecheck
    scanignore:
      - expo/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
    scandelete:
      - node_modules
      - expo/node_modules
    build:
      - export APP_VARIANT=fdroid
      - export EXPO_PUBLIC_FDROID_BUILD=true
      - export EXPO_PUBLIC_SENTRY_ENABLED=false
      - export EXPO_PUBLIC_DISABLE_PUSH_NOTIFICATIONS=true
      - cd android
      - gradle :app:assembleRelease -PfdroidBuild=true -PreactNativeArchitectures=arm64-v8a
        --no-daemon --console=plain

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 8.0.0
CurrentVersionCode: 80000
