name: Quality

on:
  pull_request:
    branches: [Dev, main]
  push:
    branches: [Dev, main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SENTRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            expo/package-lock.json
      - run: npm ci
      # Web unit tests intentionally reuse shared game logic from expo/lib.
      - run: npm --prefix expo ci
      - run: npm run quality
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: npm ci
      - run: npm run quality
      - run: npm run doctor
